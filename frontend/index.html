<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunter</title>
  <style>
    :root{--bg:#0b1016;--panel:#121a23;--panel2:#18222d;--line:#293746;--text:#e7edf3;--muted:#8c9aaa;--blue:#66b3ff;--green:#43d17a;--red:#ff6b6b;--mono:"Cascadia Code",Consolas,monospace}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",sans-serif;overflow:hidden}body{background:radial-gradient(circle at 80% 0%,#17283a 0,transparent 38%),var(--bg)}
    button,select{font:inherit}button{cursor:pointer}.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(18,26,35,.94);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:baseline;gap:10px}h1{margin:0;font-size:18px}.version,.muted{color:var(--muted);font-size:12px}.spacer{flex:1}.health{display:flex;align-items:center;gap:7px;color:var(--muted);font:12px var(--mono)}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.health.online .dot{background:var(--green);box-shadow:0 0 9px var(--green)}
    .btn{border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--text);background:var(--panel2);font-weight:600}.btn:hover:not(:disabled){border-color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:#176b46;border-color:var(--green)}.danger{background:#6e2730;border-color:var(--red)}.download{background:#14558b;border-color:var(--blue)}main{max-width:1800px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:14px}.stat,.panel{border:1px solid var(--line);background:rgba(18,26,35,.92);border-radius:8px}.stat{padding:10px 13px}.stat label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.stat strong{display:block;margin-top:3px;font:14px var(--mono)}
    .workspace{display:grid;grid-template-columns:minmax(320px,.82fr) minmax(0,1.6fr);gap:14px;height:calc(100vh - 160px);min-height:0}.panel{min-height:0;overflow:hidden;display:flex;flex-direction:column}.panel-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-shrink:0}.panel-head h2{margin:0;font-size:13px}.panel-head .muted{margin-left:auto}.logs{flex:1;min-height:0;margin:0;padding:13px;overflow-y:scroll;overflow-x:hidden;white-space:pre-wrap;word-break:break-word;background:#070b10;color:#c9d5df;font:12px/1.55 var(--mono);scrollbar-width:thin;scrollbar-color:#46627d #0b1016}.logs::-webkit-scrollbar{width:12px}.logs::-webkit-scrollbar-track{background:#0b1016}.logs::-webkit-scrollbar-thumb{background:#46627d;border-radius:6px;border:3px solid #0b1016}.logs::-webkit-scrollbar-thumb:hover{background:#66b3ff}.log-line.ok{color:var(--green)}.log-line.error{color:var(--red)}.log-line.source{color:var(--blue)}
    .table-tools{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}select{min-width:190px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--text)}.table-wrap{flex:1;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:#1b4667;color:#fff;text-align:left;white-space:nowrap;padding:9px 10px}td{padding:8px 10px;border-bottom:1px solid #1d2935;vertical-align:top;max-width:310px}tr:hover td{background:rgba(102,179,255,.07)}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.score{display:inline-block;padding:2px 6px;border-radius:4px;font-weight:700;background:#33404d}.score.high{background:#1d713f}.score.good{background:#8cae4c;color:#0b1016}.score.mid{background:#d2a73e;color:#0b1016}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;padding:10px 14px;border-radius:6px;background:#176b46;color:#fff;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.error{background:#842f38}@media(max-width:950px){html,body{height:auto;min-height:100%;overflow:auto}.workspace{grid-template-columns:1fr;height:auto;min-height:0}.logs{height:420px;flex:none}.stats{grid-template-columns:repeat(2,1fr)}.topbar{flex-wrap:wrap}.spacer{display:none}}
  </style>
</head>
<body>
<header class="topbar"><div class="brand"><h1>Job Hunter</h1><span class="version">Excel-first pipeline</span></div><div class="spacer"></div><div id="health" class="health"><span class="dot"></span><span id="healthText">offline</span></div><button id="runBtn" class="btn primary">Run scan</button><button id="stopBtn" class="btn danger" disabled>Stop</button><button id="downloadBtn" class="btn download" disabled>Download Excel</button><button id="clearBtn" class="btn danger">Clear Data</button></header>
<main><section class="stats"><div class="stat"><label>Pipeline</label><strong id="pipelineState">Idle</strong></div><div class="stat"><label>Jobs scored</label><strong id="jobCount">-</strong></div><div class="stat"><label>Workbook</label><strong id="workbookState">Not ready</strong></div><div class="stat"><label>Last run</label><strong id="lastRun">-</strong></div><div class="stat"><label>Server error</label><strong id="errorText">None</strong></div></section>
<section class="workspace"><article class="panel"><div class="panel-head"><h2>Live Agent log</h2><label class="muted"><input id="follow" type="checkbox" checked> follow</label><button id="latestBtn" class="btn" type="button">Latest</button></div><pre id="logs" class="logs">Waiting for server...</pre></article><article class="panel"><div class="panel-head"><h2>Ranked jobs</h2><span id="rowCount" class="muted">No workbook loaded</span></div><div class="table-tools"><select id="sheetSelect" aria-label="Workbook sheet"><option>Connect to server</option></select><button id="refreshBtn" class="btn">Refresh</button></div><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"><tr><td class="empty">Run the pipeline or load an existing workbook.</td></tr></tbody></table></div></article></section></main><div id="toast" class="toast"></div>
<script>
const API=location.port==="5000"?"":"http://127.0.0.1:5000";
const $=id=>document.getElementById(id);let cursor=0,timer,sheets=[];
function toast(msg,err=false){const el=$("toast");el.textContent=msg;el.className=`toast show${err?" error":""}`;setTimeout(()=>el.classList.remove("show"),2600)}
async function api(path,opts){const r=await fetch(API+path,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`${r.status} ${r.statusText}`);return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function logClass(line){if(/ERROR|fail|FATAL|error/i.test(line))return"error";if(/Greenhouse|Lever|Ashby|Naukri|Workable|→/i.test(line))return"source";if(/DONE|added|passed|★/i.test(line))return"ok";return""}
function atBottom(el){return el.scrollHeight-el.scrollTop-el.clientHeight<40}
async function pollLogs(){try{const data=await api(`/api/logs?after=${cursor}&limit=400`);if(!data.logs.length)return;const box=$("logs");const stick=$("follow").checked||atBottom(box);const frag=document.createDocumentFragment();data.logs.forEach(line=>{const span=document.createElement("span");span.className=`log-line ${logClass(line)}`;span.textContent=line+"\n";frag.appendChild(span)});box.appendChild(frag);while(box.childNodes.length>6000)box.removeChild(box.firstChild);cursor=data.total;if(stick){box.scrollTop=box.scrollHeight;$("follow").checked=true}}catch(_){} }
function bindLogScroll(){const box=$("logs");box.addEventListener("scroll",()=>{if(!atBottom(box))$("follow").checked=false;else $("follow").checked=true})}
function scoreClass(v){const n=Number(v);return n>=90?"high":n>=80?"good":n>=70?"mid":""}
function cell(value,column,row){if(column==="Apply Now"&&(row["Job URL"]||value))return`<a href="${esc(row["Job URL"]||value)}" target="_blank" rel="noopener">Open apply</a>`;if(["Job URL","Contact Page"].includes(column)&&value)return`<a href="${esc(value)}" target="_blank" rel="noopener">Open link</a>`;if(column==="Score")return`<span class="score ${scoreClass(value)}">${esc(value)}</span>`;return esc(value)}
async function loadResults(sheet){try{const data=await api(`/api/results?sheet=${encodeURIComponent(sheet)}`);$("tableHead").innerHTML=`<tr>${data.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`;$("tableBody").innerHTML=data.rows.length?data.rows.map(row=>`<tr>${data.columns.map(c=>`<td>${cell(row[c],c,row)}</td>`).join("")}</tr>`).join(""):`<tr><td class="empty" colspan="${data.columns.length||1}">No rows in this sheet.</td></tr>`;$("rowCount").textContent=`${data.rows.length} rows`}catch(e){toast(e.message,true)}}
async function loadSheets(){try{const data=await api("/api/sheets");sheets=data.sheets;$("sheetSelect").innerHTML=sheets.map(s=>`<option>${esc(s)}</option>`).join("");if(sheets.length)await loadResults(sheets[0])}catch(_){}}
async function pollStatus(){try{const status=await api("/api/status");$("health").classList.add("online");$("healthText").textContent="Agent Alive";$("pipelineState").textContent=status.running?"Running":status.exit_code===0?"Complete":status.last_error?"Error":"Idle";$("stopBtn").disabled=!status.running;$("runBtn").disabled=status.running;$("clearBtn").disabled=status.running;$("downloadBtn").disabled=!status.excel_ready;$("workbookState").textContent=status.excel_ready?`${Math.round(status.excel_size/1024)} KB ready`:"Not ready";$("lastRun").textContent=status.finished_at?new Date(status.finished_at*1000).toLocaleString():"-";$("errorText").textContent=status.last_error||"None";await pollLogs();if(status.excel_ready&&!sheets.length)await loadSheets()}catch(_){$("health").classList.remove("online");$("healthText").textContent="offline"}clearTimeout(timer);timer=setTimeout(pollStatus,1500)}
$("runBtn").onclick=async()=>{try{cursor=0;$("logs").textContent="";$("follow").checked=true;sheets=[];await api("/api/run",{method:"POST"});toast("Pipeline started")}catch(e){toast(e.message,true)}};
$("stopBtn").onclick=async()=>{try{await api("/api/stop",{method:"POST"});toast("Stop signal sent")}catch(e){toast(e.message,true)}};
$("downloadBtn").onclick=()=>{location.href=API+"/api/download"};$("refreshBtn").onclick=loadSheets;$("sheetSelect").onchange=e=>loadResults(e.target.value);
$("clearBtn").onclick=async()=>{if(!confirm("Delete jobs.db, applied.xlsx, and profile cache?\nThis cannot be undone."))return;try{const r=await api("/api/clear",{method:"POST"});toast(`Cleared: ${r.deleted.join(", ")||"nothing to delete"}`);cursor=0;$("logs").textContent="";sheets=[];$("sheetSelect").innerHTML="<option>No workbook</option>";$("tableHead").innerHTML="";$("tableBody").innerHTML=`<tr><td class="empty">Run the pipeline to generate Excel.</td></tr>`;$("rowCount").textContent="No workbook loaded";$("workbookState").textContent="Not ready"}catch(e){toast(e.message,true)}};
  $("latestBtn").onclick=()=>{const box=$("logs");box.scrollTop=box.scrollHeight;$("follow").checked=true;};
bindLogScroll();pollStatus();
</script></body></html>
